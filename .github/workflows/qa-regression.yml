name: QA Regression (API + E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright — Regresión
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_BASE_URL: http://localhost:3000
      UI_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            back/package-lock.json
            front/package-lock.json
            qaAutomationChallenge/package-lock.json

      - name: Install backend dependencies
        working-directory: back
        run: npm ci

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Install automation dependencies
        working-directory: qaAutomationChallenge
        run: npm ci

      - name: Install Playwright (Chromium + deps OS)
        working-directory: qaAutomationChallenge
        run: npx playwright install chromium --with-deps

      - name: Start backend (port 3000)
        working-directory: back
        run: |
          nohup node server.js > "${{ github.workspace }}/back.log" 2>&1 &
          echo $! > "${{ github.workspace }}/back.pid"

      - name: Start frontend (port 4000)
        working-directory: front
        run: |
          nohup node server.js > "${{ github.workspace }}/front.log" 2>&1 &
          echo $! > "${{ github.workspace }}/front.pid"

      - name: Wait for services
        run: |
          npx --yes wait-on@7.2.0 \
            http-get://127.0.0.1:4000/register \
            http-get://127.0.0.1:4000/login \
            -t 120000 \
            -i 2000 \
            -v
          echo "Frontend OK; waiting for backend API..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://127.0.0.1:3000/register \
              -H "Content-Type: application/json" \
              -d '{"email":"","password":""}' || true)
            if [ "$code" = "422" ]; then
              echo "Backend API OK (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat back.log || true
          exit 1

      - name: Run Playwright (API + E2E)
        working-directory: qaAutomationChallenge
        run: npm test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qaAutomationChallenge/playwright-report/
          retention-days: 14

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            back.log
            front.log
          retention-days: 7
